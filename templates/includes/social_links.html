{% if info.linkedin %}
<li>
    <a href="{{ info.linkedin }}" target="_blank" rel="noopener noreferrer">
        <i class="im im-linkedin" aria-hidden="true"></i><span>LinkedIn</span>
    </a>
</li>
{% endif %}
{% if info.google_scholar %}
<li>
    <a href="{{ info.google_scholar }}" target="_blank" rel="noopener noreferrer">
        <i class="im im-scholar" aria-hidden="true"></i><span>Google Scholar</span>
    </a>
</li>
{% endif %}
{% if info.email %}
<li>
    <a href="mailto:{{ info.email }}">
        <i class="im im-mail" aria-hidden="true"></i><span>Email</span>
    </a>
</li>
{% endif %}
{% if info.github %}
<li>
    <a href="{{ info.github }}" target="_blank" rel="noopener noreferrer">
        <i class="im im-github" aria-hidden="true"></i><span>GitHub</span>
    </a>
</li>
{% endif %}
