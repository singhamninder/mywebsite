[project]
name = "mywebsite"
version = "0.1.0"
description = "Django portfolio website"
readme = "Readme.md"
requires-python = ">=3.11"
dependencies = [
    "asgiref==3.8.1",
    "dj-database-url==3.0.0",
    "django==5.2.14",
    "gunicorn==23.0.0",
    "pillow==11.3.0",
    "python-decouple==3.8",
    "pytz==2025.2",
    "sqlparse==0.5.3",
    "whitenoise==6.9.0",
]

[dependency-groups]
dev = [
    "ruff",
    "ty",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".venv",
    "home/migrations",
    "staticfiles",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "I001"]

[tool.ruff.lint.per-file-ignores]
"home/tests.py" = ["F401"]

[tool.ty]
rules.unresolved-attribute = "ignore"
